<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    
    <!-- CSS -->
    <link rel="stylesheet" href="CSS/login.css">

</head>
<body>
    <main class="container-login">
        <div class="img-fundo"></div>
        <div class="box-form">
            <h1 class="titulo-login">Login</h1>
            <form action="#" method="post" class="form-login" id="form-login">
                <label for="email">
                    <i class="fa-regular fa-envelope"></i> Email
                </label>
                <input type="email" name="email" id="email" required>
                
                <label for="senha">
                    <i class="fa-solid fa-key"></i> Senha
                </label>
                <input type="password" name="senha" id="senha" required>
                
                <input type="submit" value="Acessar" class="acessar" id="acessar">
            </form>
            <a href="cadastro.html">Não tem cadastro?</a>
        </div>
    </main>
</body>
</html>
